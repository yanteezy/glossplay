name: macOS dmg

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]   # Apple Silicon and Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: brew install mpv ffmpeg dylibbundler create-dmg
      - run: cargo build --release --locked -p glossplay
      - run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: glossplay-macos-${{ matrix.os }}
          path: dist/*.dmg
          if-no-files-found: error
